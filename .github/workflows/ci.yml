name: ci

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust/pi-shadow-kernel

      - uses: jetli/wasm-pack-action@v0.10.0

      - name: npm ci
        run: npm ci

      - name: cargo test
        run: cargo test
        working-directory: rust/pi-shadow-kernel

      - name: cargo clippy
        run: cargo clippy --all-targets
        working-directory: rust/pi-shadow-kernel

      - name: build wasm kernel
        run: node rust/build-wasm.mjs

      - name: npm run verify
        run: npm run verify

      - name: npm run build
        run: npm run build
