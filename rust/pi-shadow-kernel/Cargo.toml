[package]
name = "pi-shadow-kernel"
version = "0.2.0"
edition = "2021"
description = "Pure computational kernel for pi-shadow-mind, compiled to WASM and inlined into the ESM bundle."
license = "MIT"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
regex = "1"

# These are only needed when compiling the cdylib for wasm32-unknown-unknown.
# wee_alloc provides the global allocator the bare wasm32 target lacks; swap for
# `talc` if preferred. Host `cargo test` (rlib) never touches these.
[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2"
wee_alloc = "0.4"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
